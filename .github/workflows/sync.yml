# 用途：每天自动把上游 Aethersailor/Custom_OpenClash_Rules 的更新，合并到你自己 fork 的仓库
# 放置位置：你 fork 出来的仓库里新建 .github/workflows/sync.yml，把下面内容整个粘进去
name: 自动同步上游

on:
  schedule:
    - cron: "0 20 * * *"   # 每天 04:00（北京时间 UTC+8）
  workflow_dispatch:       # 想立刻同步时，在 Actions 页面点一下 Run workflow

permissions:
  contents: write          # 允许这个工作流把更新写进你自己的仓库

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 从上游拉取更新并合并
        uses: tgymnich/fork-sync@v2
        with:
          owner: Aethersailor            # 上游作者
          repo: Custom_OpenClash_Rules   # 上游仓库名
          base: main                     # 上游分支
          head: main                     # 你自己仓库的分支
          merge_method: merge            # 用 merge 合并（也可改 rebase）
          ignore_fail: true              # 万一同步失败不要报错中断
          token: ${{ secrets.GITHUB_TOKEN }}   # GitHub 自动提供的令牌，不用自己建
